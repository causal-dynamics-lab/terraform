name: release

# Cuts an alpha/beta/stable release: validates every module, runs core's
# script<->module parity test, stamps the semver into the prepare modules,
# commits, tags, and publishes the GitHub release. Dispatchable only from the
# release branch — promote main into release first (see RELEASING.md).

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        required: true
        options:
          - alpha
          - beta
          - stable
      version:
        description: Full semver with v prefix (vX.Y.Z for stable, vX.Y.Z-alpha.N / vX.Y.Z-beta.N otherwise)
        type: string
        required: true
      core_ref:
        description: xfabric-sec/core ref to run the parity test against
        type: string
        required: false
        default: main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Refuse to release from anything but the release branch
        if: github.ref != 'refs/heads/release'
        run: |
          echo "Releases are cut from the release branch only (got ${GITHUB_REF})." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out core (parity test + semver validator)
        uses: actions/checkout@v4
        with:
          repository: xfabric-sec/core
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.CORE_READ_TOKEN }}
          path: core
          fetch-depth: 1

      - name: Validate version against channel
        run: |
          bash core/.github/scripts/validate-semver.sh "$VERSION" "version"
          case "$CHANNEL" in
            stable) pattern='^v[0-9]+\.[0-9]+\.[0-9]+$' ;;
            alpha) pattern='^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$' ;;
            beta) pattern='^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$' ;;
          esac
          if ! [[ "$VERSION" =~ $pattern ]]; then
            echo "$VERSION is not a $CHANNEL version." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists." >&2
            exit 1
          fi

      - name: Stamp version into the prepare modules
        run: |
          v="${VERSION#v}"
          sed -i "s/prepare_version = \"[^\"]*\"/prepare_version = \"$v\"/" cielara-prepare/*/release.tf
          echo "$v" > VERSION
          git diff --stat

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: fmt + validate every module
        run: |
          for dir in cielara-prepare/gke cielara-prepare/gcp cielara-prepare/aks cielara-prepare/eks \
            cielara-ai-foundry \
            cielara-enterprise-cloud-network/azure/vnet cielara-enterprise-cloud-network/azure/private-endpoints \
            cielara-enterprise-cloud-network/aws/vpc cielara-enterprise-cloud-network/aws/remote-cluster-connectivity \
            cielara-enterprise-cloud-network/gcp/vpc; do
            terraform -chdir="$dir" fmt -check -recursive
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Parity gate (script <-> module drift fails the release)
        working-directory: core
        run: CIELARA_TF_MODULES_DIR="$GITHUB_WORKSPACE" go test -run TestPrepareModuleParity ./license/api/

      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cielara-prepare/gke/release.tf cielara-prepare/gcp/release.tf \
            cielara-prepare/eks/release.tf cielara-prepare/aks/release.tf VERSION
          git diff --cached --quiet || git commit -m "release: $VERSION"
          git tag -a "$VERSION" -m "release: $VERSION ($CHANNEL)"
          git push origin HEAD:release "refs/tags/$VERSION"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          if [ "$CHANNEL" != "stable" ]; then
            prerelease="--prerelease"
          fi
          gh release create "$VERSION" $prerelease --generate-notes --title "$VERSION ($CHANNEL)"

name: release

# Cuts an alpha/beta/stable release without ever committing to a branch:
# validates every module, runs core's script<->module parity test, stamps the
# semver into the prepare modules on a detached commit, tags that commit, and
# publishes the GitHub release. Branches always carry 0.0.0-dev; only tags
# carry a stamped tree. Alphas are cut from any commit on the release branch;
# beta/stable are promoted from an existing alpha/beta tag (see RELEASING.md).

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        required: true
        options:
          - alpha
          - beta
          - stable
      version:
        description: Base version X.Y.Z (e.g. 0.4.0) — the alpha/beta counter is picked automatically
        type: string
        required: true
      source:
        description: "alpha: commit on the release branch (empty = head). beta/stable: the alpha/beta tag being promoted."
        type: string
        required: false
        default: ''
      core_ref:
        description: xfabric-sec/core ref to run the parity test against
        type: string
        required: false
        default: main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
      SOURCE: ${{ inputs.source }}
    steps:
      - name: Refuse to release from anything but the release branch
        if: github.ref != 'refs/heads/release'
        run: |
          echo "Releases are cut from the release branch only (got ${GITHUB_REF})." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out core (parity test + semver validator)
        uses: actions/checkout@v4
        with:
          repository: xfabric-sec/core
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.TERRAFORM_RELEASE_CORE_READ_TOKEN }}
          path: core
          fetch-depth: 1

      - name: Compute the release version
        run: |
          base="${BASE#v}"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be a plain X.Y.Z base (got '$BASE')." >&2
            exit 1
          fi
          if [ "$CHANNEL" = "stable" ]; then
            version="v$base"
            if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              echo "Tag $version already exists." >&2
              exit 1
            fi
          else
            last=$(git tag -l "v$base-$CHANNEL.*" |
              grep -E "^v$base-$CHANNEL\.[0-9]+$" |
              awk -F. '{print $NF}' | sort -n | tail -1)
            version="v$base-$CHANNEL.$(( ${last:-0} + 1 ))"
          fi
          bash core/.github/scripts/validate-semver.sh "$version" "version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing $version"

      - name: Resolve and check out the release source
        run: |
          tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.[0-9]+$'
          if [ "$CHANNEL" = "alpha" ]; then
            src="${SOURCE:-HEAD}"
            if ! git rev-parse -q --verify "$src^{commit}" >/dev/null; then
              echo "source '$src' is not a commit in this repository." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$src" HEAD; then
              echo "source '$src' is not on the release branch — alphas are cut from release-branch commits only." >&2
              exit 1
            fi
          else
            if [ -z "$SOURCE" ]; then
              echo "$CHANNEL releases promote an existing prerelease: pass the alpha/beta tag as source." >&2
              exit 1
            fi
            if ! [[ "$SOURCE" =~ $tag_pattern ]]; then
              echo "source '$SOURCE' is not an alpha/beta tag — $CHANNEL releases are promoted from one." >&2
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/$SOURCE" >/dev/null; then
              echo "source tag '$SOURCE' does not exist." >&2
              exit 1
            fi
            if [ "${SOURCE%%-*}" != "${VERSION%%-*}" ]; then
              echo "version base ${VERSION%%-*} does not match source tag base ${SOURCE%%-*} — a promotion keeps X.Y.Z." >&2
              exit 1
            fi
            src="refs/tags/$SOURCE"
          fi
          git checkout --detach "$src"
          echo "Releasing $VERSION from $(git rev-parse HEAD) ($src)"

      - name: Stamp version into the prepare modules
        run: |
          v="${VERSION#v}"
          # Value-only replacement: terraform fmt owns the spacing around "=",
          # so the pattern must not assume it.
          sed -E -i "s/(prepare_version[[:space:]]*=[[:space:]]*)\"[^\"]*\"/\\1\"$v\"/" cielara-prepare/*/release.tf
          if [ "$CHANNEL" = "alpha" ]; then
            # HEAD is still the pre-stamp source commit on the release branch —
            # the lineage key promotions inherit. Beta/stable re-stamp the
            # source tag's tree, which already carries the alpha's revision.
            rev="$(git rev-parse HEAD)"
            sed -E -i "s/(prepare_revision[[:space:]]*=[[:space:]]*)\"[^\"]*\"/\\1\"$rev\"/" cielara-prepare/*/release.tf
          else
            for f in cielara-prepare/*/release.tf; do
              if ! grep -qE 'prepare_revision[[:space:]]*=[[:space:]]*"[0-9a-f]{40}"' "$f"; then
                echo "$f carries no stamped prepare_revision — promoting a pre-revision tag would publish a lineage-less release. Cut a fresh alpha instead." >&2
                exit 1
              fi
            done
          fi
          echo "$v" > VERSION
          git diff --stat

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: fmt + validate every module
        run: |
          for dir in cielara-prepare/gke cielara-prepare/gcp cielara-prepare/aks cielara-prepare/eks \
            cielara-ai-foundry \
            cielara-enterprise-cloud-network/azure/vnet cielara-enterprise-cloud-network/azure/private-endpoints \
            cielara-enterprise-cloud-network/aws/vpc cielara-enterprise-cloud-network/aws/remote-cluster-connectivity \
            cielara-enterprise-cloud-network/gcp/vpc; do
            terraform -chdir="$dir" fmt -check -recursive
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Parity gate (script <-> module drift fails the release)
        working-directory: core
        run: CIELARA_TF_MODULES_DIR="$GITHUB_WORKSPACE" go test -run TestPrepareModuleParity ./license/api/

      - name: Commit detached, tag, push the tag only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cielara-prepare/gke/release.tf cielara-prepare/gcp/release.tf \
            cielara-prepare/eks/release.tf cielara-prepare/aks/release.tf VERSION
          git commit -m "release: $VERSION"
          git tag -a "$VERSION" -m "release: $VERSION ($CHANNEL)"
          git push origin "refs/tags/$VERSION"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          if [ "$CHANNEL" != "stable" ]; then
            prerelease="--prerelease"
          fi
          # Machine-readable release metadata: consumers (the control plane's
          # tf-prepare-ref resolution) learn the target's lineage without
          # cloning the tag. Asset only — never committed.
          rev="$(sed -nE 's/.*prepare_revision[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' cielara-prepare/gke/release.tf | head -1)"
          src_tag=""
          if [ "$CHANNEL" != "alpha" ]; then
            src_tag="$SOURCE"
          fi
          jq -n --arg version "$VERSION" --arg channel "$CHANNEL" \
            --arg revision "$rev" --arg source_tag "$src_tag" \
            '{version: $version, channel: $channel, revision: $revision, source_tag: $source_tag}' \
            > release.json
          gh release create "$VERSION" $prerelease --generate-notes --title "$VERSION ($CHANNEL)" release.json

name: tf-check

# Cheap gate: format, validate, and run the offline (mock_provider) tests for
# every module. No cloud credentials needed. Runs unconditionally so it can be
# a required status check on main and release.

on:
  pull_request:
  push:
    branches: [main, release]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cielara-prepare/gke
          - cielara-prepare/gcp
          - cielara-prepare/aks
          - cielara-prepare/eks
          - cielara-prepare/gke/verify
          - cielara-prepare/gcp/verify
          - cielara-ai-foundry
          - cielara-enterprise-cloud-network/azure/vnet
          - cielara-enterprise-cloud-network/azure/private-endpoints
          - cielara-enterprise-cloud-network/aws/vpc
          - cielara-enterprise-cloud-network/aws/remote-cluster-connectivity
          - cielara-enterprise-cloud-network/gcp/vpc
          - cdl-registry-prepare/gke
          - cdl-registry-prepare/gcp
          - cdl-registry-prepare/aks
          - cdl-registry-prepare/eks
          - cdl-registry-prepare/gke/verify
          - cdl-registry-prepare/gcp/verify
          - cdl-registry-networking/aws
          - cdl-registry-networking/aws/modules/remote-cluster-connectivity
          - cdl-registry-networking/azure
          - cdl-registry-networking/azure/modules/private-endpoints
          - cdl-registry-networking/gcp
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init (no backend)
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate

      - name: test (offline, mock_provider)
        if: hashFiles(format('{0}/tests/*.tftest.hcl', matrix.module)) != ''
        run: terraform test
